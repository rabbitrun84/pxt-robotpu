<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Robot PU — trace viewer</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f26; --line: #2a2f39;
    --ink: #e6e9ef; --dim: #8b93a3; --accent: #ff8a3d;
    --left: #4da3ff; --right: #ff6b6b; --head: #9d7bff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  header {
    padding: 12px 18px; border-bottom: 1px solid var(--line);
    display: flex; gap: 20px; align-items: baseline; flex-wrap: wrap;
  }
  h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .meta { color: var(--dim); font-size: 12px; }
  main { display: flex; gap: 14px; padding: 14px 18px; flex-wrap: wrap; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
  .panel h2 {
    font-size: 11px; margin: 0 0 8px; color: var(--dim);
    text-transform: uppercase; letter-spacing: .08em; font-weight: 600;
  }
  #transport {
    padding: 10px 18px; border-top: 1px solid var(--line);
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
    position: sticky; bottom: 0; background: var(--bg);
  }
  button, select {
    background: #262a33; color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  #scrub { flex: 1; min-width: 220px; accent-color: var(--accent); }
  #clock { color: var(--accent); min-width: 110px; }
  table { border-collapse: collapse; font-size: 12px; }
  td { padding: 2px 10px 2px 0; }
  td.v { color: var(--accent); text-align: right; }
  .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; }
  #drop { color: var(--dim); font-size: 12px; }
  #about {
    margin: 14px 18px 0; padding: 11px 14px; border-radius: 8px;
    background: var(--panel); border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    color: var(--dim); font-size: 12.5px; line-height: 1.6;
    white-space: pre-wrap; max-height: 210px; overflow: auto;
  }
  #about b { color: var(--ink); font-weight: 600; }

  /* editor */
  #codePanel { padding: 14px 18px 0; }
  #codePanel .panel { width: 100%; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .row label { color: var(--dim); font-size: 12px; display: flex; align-items: center; gap: 5px; }
  .row input[type=number] { width: 78px; }
  input[type=text], input[type=number] {
    background: #262a33; color: var(--ink); border: 1px solid var(--line);
    border-radius: 5px; padding: 5px 7px; font: inherit; font-size: 12px;
  }
  button.primary { background: var(--accent); color: #14161a; border-color: var(--accent); font-weight: 600; }
  button.primary:disabled { opacity: .5; cursor: default; }
  #code {
    width: 100%; height: 260px; resize: vertical;
    background: #101318; color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 10px; font: 13px/1.55 ui-monospace, Menlo, monospace;
    tab-size: 4; white-space: pre; overflow-wrap: normal; overflow-x: auto;
  }
  #code:focus { outline: none; border-color: var(--accent); }
  #problems {
    margin: 10px 0 0; padding: 10px; border-radius: 6px; font-size: 12px;
    background: #22171a; border: 1px solid #5c2b33; color: #ffb4b4;
    white-space: pre-wrap; max-height: 160px; overflow: auto;
  }
  #problems.warn { background: #241f14; border-color: #5c4a2b; color: #ffd9a0; }
  #problems.ok { background: #16211a; border-color: #2b5c3a; color: #a8e6bd; }
</style>
</head>
<body>

<header>
  <h1>Robot PU — trace viewer</h1>
  <button id="toggleCode">&lt;/&gt; code</button>
  <select id="trace" title="traces in tools/simulator/traces/"></select>
  <span class="meta" id="hdr">loading…</span>
  <span id="drop">· or drop a trace .json here</span>
</header>

<div id="about" hidden></div>

<section id="codePanel" hidden>
  <div class="panel">
    <h2>Program — JavaScript / TypeScript</h2>
    <div class="row">
      <select id="example" title="load an example program"><option value="">load example…</option></select>
      <label>run <input type="number" id="optMs" value="8000" min="100" step="500"> ms</label>
      <label>sound
        <select id="optSound">
          <option value="quiet">quiet</option>
          <option value="beat:120">beat 120</option>
          <option value="beat:90">beat 90</option>
          <option value="beat:150">beat 150</option>
        </select>
      </label>
      <label>buttons <input type="text" id="optButtons" placeholder="200:A" size="8"></label>
      <label>i2c <input type="number" id="optI2c" value="0" min="0" step="100" size="5"> µs</label>
      <label><input type="checkbox" id="optSkipBoot"> skip boot</label>
      <button id="runBtn" class="primary">▶ Build &amp; Run</button>
      <span id="runStatus" class="meta"></span>
    </div>
    <textarea id="code" spellcheck="false" placeholder="// Write a Robot PU program, then press Build & Run.
basic.forever(function () {
    robotPuPro.servo(robotPuPro.ServoJoint.LeftLeg, 120)
    basic.pause(400)
    robotPuPro.servo(robotPuPro.ServoJoint.LeftLeg, 60)
    basic.pause(400)
})"></textarea>
    <pre id="problems" hidden></pre>
  </div>
</section>

<main>
  <div class="panel">
    <h2>Side view — leg swing</h2>
    <canvas id="side" width="430" height="330"></canvas>
  </div>
  <div class="panel">
    <h2>Front — weight shift</h2>
    <canvas id="front" width="230" height="330"></canvas>
  </div>
  <div class="panel">
    <h2>Joints</h2>
    <table id="readout"></table>
  </div>
  <div class="panel" style="flex:1; min-width:380px">
    <h2>Servo angles over time</h2>
    <canvas id="chart" width="900" height="200" style="width:100%"></canvas>
  </div>
</main>

<div id="transport">
  <button id="play">▶ play</button>
  <input type="range" id="scrub" min="0" max="0" value="0">
  <span id="clock">—</span>
  <select id="speed">
    <option value="0.25">0.25×</option>
    <option value="0.5">0.5×</option>
    <option value="1" selected>1×</option>
    <option value="2">2×</option>
    <option value="4">4×</option>
  </select>
  <input type="file" id="file" accept=".json" style="display:none">
  <button id="pick">open trace…</button>
</div>

<script src="viewer.js"></script>
</body>
</html>
