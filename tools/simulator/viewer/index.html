<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Robot PU — trace viewer</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f26; --line: #2a2f39;
    --ink: #e6e9ef; --dim: #8b93a3; --accent: #ff8a3d;
    --left: #4da3ff; --right: #ff6b6b; --head: #9d7bff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  header {
    padding: 12px 18px; border-bottom: 1px solid var(--line);
    display: flex; gap: 20px; align-items: baseline; flex-wrap: wrap;
  }
  h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .meta { color: var(--dim); font-size: 12px; }
  main { display: flex; gap: 14px; padding: 14px 18px; flex-wrap: wrap; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
  .panel h2 {
    font-size: 11px; margin: 0 0 8px; color: var(--dim);
    text-transform: uppercase; letter-spacing: .08em; font-weight: 600;
  }
  #transport {
    padding: 10px 18px; border-top: 1px solid var(--line);
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
    position: sticky; bottom: 0; background: var(--bg);
  }
  button, select {
    background: #262a33; color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  #scrub { flex: 1; min-width: 220px; accent-color: var(--accent); }
  #clock { color: var(--accent); min-width: 110px; }
  table { border-collapse: collapse; font-size: 12px; }
  td { padding: 2px 10px 2px 0; }
  td.v { color: var(--accent); text-align: right; }
  .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; }
  #drop { color: var(--dim); font-size: 12px; }
</style>
</head>
<body>

<header>
  <h1>Robot PU — trace viewer</h1>
  <span class="meta" id="hdr">loading…</span>
  <span id="drop">· or drop a trace .json here</span>
</header>

<main>
  <div class="panel">
    <h2>Side view — leg swing</h2>
    <canvas id="side" width="430" height="330"></canvas>
  </div>
  <div class="panel">
    <h2>Front — weight shift</h2>
    <canvas id="front" width="230" height="330"></canvas>
  </div>
  <div class="panel">
    <h2>Joints</h2>
    <table id="readout"></table>
  </div>
  <div class="panel" style="flex:1; min-width:380px">
    <h2>Servo angles over time</h2>
    <canvas id="chart" width="900" height="200" style="width:100%"></canvas>
  </div>
</main>

<div id="transport">
  <button id="play">▶ play</button>
  <input type="range" id="scrub" min="0" max="0" value="0">
  <span id="clock">—</span>
  <select id="speed">
    <option value="0.25">0.25×</option>
    <option value="0.5">0.5×</option>
    <option value="1" selected>1×</option>
    <option value="2">2×</option>
    <option value="4">4×</option>
  </select>
  <input type="file" id="file" accept=".json" style="display:none">
  <button id="pick">open trace…</button>
</div>

<script src="viewer.js"></script>
</body>
</html>
